<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4F8FF">
  <meta name="color-scheme" content="light">
  <meta name="description" content="IELTS 工作台 —— 词汇、真题、写作、口语、打卡与进度看板一体的雅思备考工作台，数据本地保存，支持导入导出。">
  <title>IELTS 工作台 · 备考工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F6BFF'/%3E%3Cpath d='M7 22l6-12 4 7 3-5 5 10' fill='none' stroke='%23FFFFFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<!--
DIRECTION CONTRACT — 白瓷气泡 / Porcelain Bubbles (用户指定：白+蓝主调、气泡元素作交互按钮、灵动简洁；功能不变)
THESIS: 备考进度不该像报表，而该像一串浮在晨光里的气泡——每个控件都能被按下去、弹回来；拒绝深色数据终端的仪表盘腔调。
OWN-WORLD: 白瓷(#F4F8FF)地面上浮着天青蓝(#2F6BFF)的光；白色胶囊导航、圆形图标按钮、药丸标签、14 天圆点矿脉；景深只用带偏移的柔和投影与单级白面抬升，不用描边分栏；文字深海军蓝，蓝=进度/操作，薄荷=成功，琥珀=部分，玫红=破坏。
STORY: 打开就看见"今天该做什么"：倒计时与连续打卡是最大的两颗气泡，勾掉任务即时联动；六个模块都从同一套胶囊/圆点语言进出。
FIRST VIEWPORT: 顶部白色胶囊状态条(品牌 + 连续打卡 + 导出/导入)；左侧悬浮白卡胶囊导航；主区四颗统计气泡(首颗蓝底) + 今日任务气泡卡 + 14 天圆点格子 + 模块进度与操作日志。
FORM: 白瓷气泡世界(用户指定方向；未走候选掷骰)。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<div id="app" class="shell">
  <header class="topbar">
    <div class="topbar-left">
      <button id="menu-toggle" class="menu-btn" type="button" aria-label="打开模块菜单" aria-expanded="false" aria-controls="module-menu" title="全部模块">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12M2 8h12M2 11.5h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="#/dashboard" aria-label="IELTS 工作台首页">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 22l6-12 4 7 3-5 5 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-name">IELTS<span class="brand-accent">工作台</span></span>
      </a>
      <nav id="module-menu" class="module-menu" aria-label="模块菜单" hidden></nav>
    </div>
    <div class="topbar-right">
      <div id="global-streak" class="streak-chip" title="连续打卡天数" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14s4-2.8 4-6A4 4 0 0 0 8 4a4 4 0 0 0-4 4c0 3.2 4 6 4 6z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 9.5c1 0 1.8-.5 1.8-1.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span id="global-streak-num">0</span><span class="streak-unit">天</span>
      </div>
      <div class="topbar-actions">
        <button id="btn-export" class="btn btn-ghost btn-sm" type="button" title="导出进度为 JSON 文件">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v7m0 0l-2.6-2.6M8 10l2.6-2.6M3.5 12.5h9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>导出</span>
        </button>
        <button id="btn-import" class="btn btn-ghost btn-sm" type="button" title="从 JSON 文件导入进度">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12V5m0 0L5.4 7.6M8 5l2.6 2.6M3.5 3.5h9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>导入</span>
        </button>
      </div>
    </div>
  </header>
  <div class="body">
    <nav class="sidebar" aria-label="主导航">
      <ul class="nav-list" id="nav-list"></ul>
      <div class="sidebar-foot">
        <a id="btn-settings" class="nav-item" href="#/settings" data-nav="settings" aria-label="设置与数据" title="设置与数据">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>设置与数据</span>
        </a>
      </div>
    </nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toast-region" class="toast-region" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script type="module" src="js/app.js?v=5"></script>
</body>
</html>
